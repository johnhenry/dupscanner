[package]
name = "dupscanner"
version = "0.2.0"
edition = "2021"
authors = ["John Henry"]
description = "Duplicate file scanner with an interactive TUI and a local web UI"
license = "MIT"
repository = "https://github.com/johnhenry/dupscanner"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["json", "query"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
crossterm = "0.28"
dirs = "5.0"
futures-util = "0.3"
glob = "0.3"
humansize = "2.1"
mime_guess = "2.0"
open = "5.3"
percent-encoding = "2.3"
rand = "0.8"
ratatui = "0.28"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["limit"] }
trash = "5.1"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.12"
