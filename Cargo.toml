[package]
name = "dupscanner"
version = "0.1.0"
edition = "2021"
authors = ["Claude Code"]
description = "An intelligent duplicate file scanner with TUI"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
tokio = { version = "1.40", features = ["full"] }
walkdir = "2.5"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
indicatif = "0.17"
colored = "2.1"
rayon = "1.10"
humansize = "2.1"
dirs = "5.0"
md5 = "0.7"
rand = "0.8"
glob = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3.12"
